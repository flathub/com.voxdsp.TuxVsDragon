app-id: com.voxdsp.TuxVsDragon
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: tuxvsdragon
rename-icon: tuxvsdragon
rename-desktop-file: tuxvsdragon.desktop
rename-appdata-file: tuxvsdragon.appdata.xml
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - name: glfw
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DGLFW_BUILD_EXAMPLES=OFF
      - -DGLFW_BUILD_TESTS=OFF
      - -DGLFW_BUILD_DOCS=OFF
      - -DGLFW_BUILD_WAYLAND=1
    sources:
      - type: git
        url: https://github.com/glfw/glfw.git
        # The latest commit from the repository
        commit: fdd14e65b1c29e4e6df875fb5669ec00d6793531
  - name: tuxvsdragon
    buildsystem: simple
    build-commands:
      - cc main.c glad_gl.c -I inc -Ofast -L/app/lib -lglfw -lm -o tuxvsdragon
      - install -Dm 0755 tuxvsdragon -t ${FLATPAK_DEST}/bin
      - install -Dm 0644 flat/tuxvsdragon.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm 0644 flat/tuxvsdragon.appdata.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm 0644 flat/tuxvsdragon.png -t ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/
    sources:
      - type: git
        url: https://github.com/mrbid/tuxvsdragon.git
        # The latest commit from the repository
        commit: a03e160cf516ca0b713cc31e1791ea940130b765
